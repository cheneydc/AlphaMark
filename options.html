<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="pageTitle">AlphaMark - 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1><img src="icons/icon48.png" class="logo-icon" alt=""> AlphaMark</h1>
    </header>

    <main class="main">
      <section class="section">
        <h2 data-i18n="sectionLLM">🤖 AI 大模型设置</h2>
        <div class="form-group">
          <label class="switch-label">
            <input type="checkbox" id="llmEnabled">
            <span class="switch-slider"></span>
            <span data-i18n="llmEnableLabel">启用大模型智能分类</span>
          </label>
          <p class="form-hint-inline" data-i18n="llmEnableHint">启用后将调用大模型 API 进行书签分类，准确率更高但需要联网和 API Key</p>
        </div>

        <div id="llmSettings" class="collapsible">
          <div class="form-group">
            <label class="form-label" data-i18n="llmCustomUrl">API 地址</label>
            <input type="text" id="customBaseUrl" class="input input-full" data-i18n-placeholder="llmCustomUrlPlaceholder" placeholder="例如: https://api.openai.com/v1/chat/completions (会自动补全 /chat/completions)">
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="llmCustomModel">模型名称</label>
            <input type="text" id="customModel" class="input input-full" data-i18n-placeholder="llmCustomModelPlaceholder" placeholder="例如: gpt-4o-mini">
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="llmApiKey">API Key</label>
            <div class="input-row">
              <input type="password" id="llmApiKey" class="input input-full" data-i18n-placeholder="llmApiKeyPlaceholder" placeholder="输入 API Key">
              <button id="toggleApiKeyBtn" class="btn-toggle" title="显示/隐藏">👁</button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">
              <span data-i18n="llmMaxCategories">最大分类数</span>
              <span class="form-hint" data-i18n="llmMaxCategoriesHint">大模型最多创建多少个新分类</span>
            </label>
            <input type="number" id="llmMaxCategories" min="3" max="50" value="10" class="input">
          </div>

          <div class="form-group">
            <button id="testLLMBtn" class="btn btn-secondary btn-sm-btn" data-i18n="llmTestBtn">🔗 测试连接</button>
            <span id="testLLMResult" class="test-result"></span>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 data-i18n="sectionHistory">📊 历史记录分析</h2>
        <div class="form-group">
          <label class="form-label">
            <span data-i18n="historyMonths">分析时间范围 (月)</span>
            <span class="form-hint" data-i18n="historyMonthsHint">读取最近多少个月的浏览历史</span>
          </label>
          <select id="historyMonths" class="select">
            <option value="1" data-i18n="historyMonths1">1 个月</option>
            <option value="3" selected data-i18n="historyMonths3">3 个月 (默认)</option>
            <option value="6" data-i18n="historyMonths6">6 个月</option>
            <option value="12" data-i18n="historyMonths12">12 个月</option>
          </select>
        </div>

        <div class="form-group">
          <label class="switch-label">
            <input type="checkbox" id="includeHistoryInAnalysis" checked>
            <span class="switch-slider"></span>
            <span data-i18n="historyWeightLabel">依据访问频率调整分类置信度</span>
          </label>
          <p class="form-hint-inline" data-i18n="historyWeightHint">经常访问的书签网站将获得更高的分类优先级</p>
        </div>

        <div class="form-group">
          <label class="form-label">
            <span data-i18n="historyTopSites">显示热门站点数量</span>
            <span class="form-hint" data-i18n="historyTopSitesHint">在弹出窗口中显示的常访网站数量</span>
          </label>
          <input type="number" id="topSitesCount" min="5" max="50" value="20" class="input">
        </div>
      </section>

      <section class="section">
        <h2 data-i18n="sectionClassify">分类设置</h2>
        <div class="form-group">
          <label class="form-label">
            <span data-i18n="confidenceThreshold">信任度阈值</span>
            <span class="form-hint" data-i18n="confidenceHint">低于此分数的书签将被标记为「未分类」</span>
          </label>
          <input type="range" id="confidenceThreshold" min="1" max="10" value="3" class="range-input">
          <span id="thresholdValue" class="range-value">3</span>
        </div>
      </section>

      <section class="section">
        <h2 data-i18n="sectionFetch">抓取设置</h2>
        <div class="form-group">
          <label class="form-label">
            <span data-i18n="maxConcurrency">最大并发请求数</span>
            <span class="form-hint" data-i18n="maxConcurrencyHint">同时抓取网页内容的最大数量</span>
          </label>
          <input type="number" id="maxConcurrentFetches" min="1" max="10" value="5" class="input">
        </div>
        <div class="form-group">
          <label class="form-label">
            <span data-i18n="fetchTimeout">请求超时 (毫秒)</span>
            <span class="form-hint" data-i18n="fetchTimeoutHint">单个网页内容抓取的超时时间</span>
          </label>
          <input type="number" id="fetchTimeout" min="2000" max="30000" step="1000" value="8000" class="input">
        </div>
        <div class="form-group">
          <label class="switch-label">
            <input type="checkbox" id="fetchPageContent" checked>
            <span class="switch-slider"></span>
            <span data-i18n="fetchContent">抓取网页内容进行深度分析</span>
          </label>
          <p class="form-hint-inline" data-i18n="fetchContentHint">关闭后仅根据书签标题和 URL 进行分类，速度更快但准确率较低</p>
        </div>
      </section>

      <section class="section">
        <h2 data-i18n="sectionAutoOrganize">⚡ 自动整理</h2>
        <div class="form-group">
          <label class="switch-label">
            <input type="checkbox" id="autoOrganizeOnBookmark">
            <span class="switch-slider"></span>
            <span data-i18n="autoOrganizeLabel">收藏书签时自动分类</span>
          </label>
          <p class="form-hint-inline" data-i18n="autoOrganizeHint">新增书签时自动分析并移入对应分类文件夹（仅高置信度触发）</p>
        </div>
      </section>

      <section class="section">
        <h2 data-i18n="sectionCategories">分类管理</h2>
        <p class="section-desc" data-i18n="categoriesDesc">自定义你的分类类别和关键词，每行一个关键词</p>
        <div id="categoriesList" class="categories-list"></div>
      </section>

      <div id="toast" class="toast hidden" data-i18n="saved">设置已保存</div>
    </main>

    <div class="actions-bar">
      <button id="saveBtn" class="btn btn-primary" data-i18n="btnSave">💾 保存设置</button>
      <button id="resetBtn" class="btn btn-secondary" data-i18n="btnReset">↩ 恢复默认</button>
    </div>
  </div>

  <script src="options.js" type="module"></script>
</body>
</html>
